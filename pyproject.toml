[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-platform"
version = "0.1.0"
description = "Suite-level platform backbone for the Sable tool stack"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "anthropic>=0.40",
    "python-telegram-bot~=21.0",
    "discord.py~=2.4",
]

[project.optional-dependencies]
dev = ["psycopg2-binary>=2.9"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
sable-platform = "sable_platform.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["sable_platform*"]

[tool.setuptools.package-data]
sable_platform = [
    "db/migrations/*.sql",
    "alembic/*.py",
    "alembic/*.mako",
    "alembic/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # discord.py 2.7.1's escape_markdown passes re.sub's `count` positionally,
    # which CPython 3.14 deprecates. Library-internal (not a relay defect — the
    # §15.2 escaping invariant still holds); narrowly scoped so it never masks a
    # real relay warning. Drop when discord.py bumps past the fix.
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils",
]

[tool.ruff]
# The lint job ran with NO ruff config and an UNPINNED ruff. Ruff's default rule set is not
# stable across releases: the same tree reported 59 findings under 0.15.9 and 1421 under
# 0.16.5, because 0.16 turned on UP, I, BLE, S, RUF and more by default. A dependency
# release moved the gate, not a commit. Both halves of that are fixed here -- the rule set
# is written down, and .github/workflows/ci.yml pins the version.
target-version = "py311"
exclude = [
    # Vendored third-party source. Not ours to restyle, and 14 of the original findings
    # were in this one file.
    "sable_platform/_vendor",
]

[tool.ruff.lint]
# Ruff's own pre-0.16 default, stated explicitly: pyflakes plus the pycodestyle errors that
# catch real faults. Everything ruff 0.16 added on top is style modernization
# (UP045/UP006/UP017 alone are 1019 of the 1415) and is separate, opt-in work -- see
# `ruff check --select UP,I sable_platform/` for the standing list.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes `import sqlalchemy as sa` into every revision from its own template,
# whether or not that revision uses it. Deleting it from one file makes that file differ
# from the other ninety for no gain.
"sable_platform/alembic/versions/*.py" = ["F401"]
